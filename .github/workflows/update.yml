name: Update prices (GitHub Pages)

# Manual fallback only. Normal updates come from the local server (server.mjs
# runs push_site.mjs after every 5-min price cycle), because GitHub throttles
# scheduled workflows on the free tier and the */15 cron effectively never ran.
# Use "Run workflow" below if the local machine is down.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fetch latest prices. If the wiki is unreachable, keep the cached prices
      # (don't fail the run).
      - name: Fetch latest prices
        run: node update_prices.mjs || echo "::warning::price fetch failed, keeping cached prices"

      - name: Regenerate workbook
        run: node gen_workbook.mjs

      - name: Build static site
        run: node build_static.mjs

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices_live.json herblore_top8.xlsx docs/
          if git diff --cached --quiet; then
            echo "no price changes — nothing to commit"
          else
            git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
